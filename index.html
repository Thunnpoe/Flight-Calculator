<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aviation Calculator</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --sky: #38bdf8;
      --sky-soft: #f0f9ff;
      --sky-border: #bae6fd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 8px 0;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.3px;
    }

    .tabs {
      display: flex;
      background: #e2e8f0;
      border-radius: 12px;
      padding: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .calc-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
      display: none;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.06);
    }

    .calc-card.active {
      display: flex;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      display: flex;
      justify-content: space-between;
    }

    .input-group label span.unit {
      color: #94a3b8;
      font-weight: 500;
    }

    /* Standard number input with native spinner arrows */
    input[type="number"] {
      width: 100%;
      background: var(--sky-soft);
      border: 1.5px solid var(--sky-border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 1.15rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 1 !important;
      height: 28px;
      cursor: pointer;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
      background: #ffffff;
    }

    input[type="number"]::placeholder {
      color: #94a3b8;
      font-weight: 400;
      font-size: 0.95rem;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 6px;
    }

    button.btn {
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button.btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    button.btn-primary:active {
      transform: scale(0.98);
      background: #0369a1;
    }

    button.btn-secondary {
      background: #f1f5f9;
      color: #475569;
    }

    button.btn-secondary:active {
      transform: scale(0.98);
      background: #e2e8f0;
    }

    /* Single-section Result Card */
    .result-box {
      margin-top: 4px;
      padding: 16px 18px;
      background: var(--sky-soft);
      border: 1.5px solid var(--sky);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .result-box.hidden {
      display: none;
    }

    .result-grid-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
    }

    .result-single-col {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .result-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .result-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary);
      font-weight: 700;
    }

    .result-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0369a1;
      line-height: 1.2;
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</head>
<body>

  <div class="container">
    <header>
      <h1>Flight Calculator</h1>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('fpa')">FPA</button>
      <button class="tab-btn" onclick="switchTab('gradient')">Gradient</button>
    </div>

    <!-- Tab 1: FPA -->
    <div id="tab-fpa" class="calc-card active">
      <div class="input-group">
        <label for="fpa-dist">Distance <span class="unit">(NM)</span></label>
        <input type="number" step="any" id="fpa-dist" placeholder="Leave empty if unknown">
      </div>

      <div class="input-group">
        <label for="fpa-height">Height <span class="unit">(ft)</span></label>
        <input type="number" step="any" id="fpa-height" placeholder="Leave empty if unknown">
      </div>

      <div class="input-group">
        <label for="fpa-degree">FPA <span class="unit">(&deg;)</span></label>
        <input type="number" step="any" id="fpa-degree" placeholder="Leave empty if unknown">
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="clearFPA()">Clear</button>
        <button class="btn btn-primary" onclick="calculateFPA()">Calculate</button>
      </div>

      <!-- FPA Result: Clean single section -->
      <div id="fpa-result" class="result-box hidden">
        <div id="fpa-result-content"></div>
      </div>
    </div>

    <!-- Tab 2: Gradient -->
    <div id="tab-gradient" class="calc-card">
      <div class="input-group">
        <label for="grad-gs">Ground Speed (GS) <span class="unit">(kts)</span></label>
        <input type="number" step="any" id="grad-gs" placeholder="Leave empty if unknown">
      </div>

      <div class="input-group">
        <label for="grad-percent">Gradient <span class="unit">(%)</span></label>
        <input type="number" step="any" id="grad-percent" placeholder="Leave empty if unknown">
      </div>

      <div class="input-group">
        <label for="grad-roc">Rate of Climb (ROC) <span class="unit">(FPM)</span></label>
        <input type="number" step="any" id="grad-roc" placeholder="Leave empty if unknown">
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="clearGradient()">Clear</button>
        <button class="btn btn-primary" onclick="calculateGradient()">Calculate</button>
      </div>

      <!-- Gradient Result: Clean single section -->
      <div id="grad-result" class="result-box hidden">
        <div id="grad-result-content"></div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.calc-card').forEach(card => card.classList.remove('active'));

      if (tab === 'fpa') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-fpa').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-gradient').classList.add('active');
      }
    }

    const NM_TO_FT = 6076;
    const fmt2 = num => (Math.round((num + Number.EPSILON) * 100) / 100).toFixed(2);
    const toRad = deg => (deg * Math.PI) / 180;
    const toDeg = rad => (rad * 180) / Math.PI;

    function renderSingle(containerId, title, value) {
      const el = document.getElementById(containerId);
      el.className = 'result-single-col';
      el.innerHTML = `
        <div class="result-item">
          <div class="result-title">${title}</div>
          <div class="result-value">${value}</div>
        </div>
      `;
    }

    function renderDual(containerId, title1, val1, title2, val2) {
      const el = document.getElementById(containerId);
      el.className = 'result-grid-row';
      el.innerHTML = `
        <div class="result-item">
          <div class="result-title">${title1}</div>
          <div class="result-value">${val1}</div>
        </div>
        <div class="result-item">
          <div class="result-title">${title2}</div>
          <div class="result-value">${val2}</div>
        </div>
      `;
    }

    function calculateFPA() {
      const distInput = document.getElementById('fpa-dist').value.trim();
      const heightInput = document.getElementById('fpa-height').value.trim();
      const degreeInput = document.getElementById('fpa-degree').value.trim();

      const dist = distInput !== '' ? parseFloat(distInput) : null;
      const height = heightInput !== '' ? parseFloat(heightInput) : null;
      const degree = degreeInput !== '' ? parseFloat(degreeInput) : null;

      const resBox = document.getElementById('fpa-result');

      // 1. Height and FPA given -> Calculate Distance (NM) and show Gradient beside it!
      if (dist === null && height !== null && degree !== null) {
        if (degree === 0 || Math.tan(toRad(degree)) === 0) {
          resBox.classList.remove('hidden');
          renderSingle('fpa-result-content', 'Error', 'Invalid FPA');
          return;
        }
        const distFt = height / Math.tan(toRad(degree));
        const calcDistNM = distFt / NM_TO_FT;
        const gradVal = degree * 1.75;

        resBox.classList.remove('hidden');
        renderDual('fpa-result-content', 'Distance', fmt2(calcDistNM) + ' NM', 'Gradient', fmt2(gradVal) + '%');
        document.getElementById('fpa-dist').value = fmt2(calcDistNM);
      }
      // 2. Distance (NM) and Height (ft) given -> Calculate FPA and show Gradient beside it!
      else if (degree === null && dist !== null && height !== null) {
        if (dist === 0) {
          resBox.classList.remove('hidden');
          renderSingle('fpa-result-content', 'Error', 'Invalid Distance');
          return;
        }
        const distFt = dist * NM_TO_FT;
        const calcDeg = toDeg(Math.atan(height / distFt));
        const gradVal = calcDeg * 1.75;

        resBox.classList.remove('hidden');
        renderDual('fpa-result-content', 'FPA', fmt2(calcDeg) + '&deg;', 'Gradient', fmt2(gradVal) + '%');
        document.getElementById('fpa-degree').value = fmt2(calcDeg);
      }
      // 3. Distance (NM) and FPA given -> Calculate Height (ft) and show Gradient beside it!
      else if (height === null && dist !== null && degree !== null) {
        const distFt = dist * NM_TO_FT;
        const calcHeight = distFt * Math.tan(toRad(degree));
        const gradVal = degree * 1.75;

        resBox.classList.remove('hidden');
        renderDual('fpa-result-content', 'Height', fmt2(calcHeight) + ' ft', 'Gradient', fmt2(gradVal) + '%');
        document.getElementById('fpa-height').value = fmt2(calcHeight);
      }
      else if (dist !== null && height !== null && degree !== null) {
        resBox.classList.remove('hidden');
        renderSingle('fpa-result-content', 'Notice', 'Clear 1 value');
      } else {
        resBox.classList.remove('hidden');
        renderSingle('fpa-result-content', 'Notice', 'Fill 2 values');
      }
    }

    function clearFPA() {
      document.getElementById('fpa-dist').value = '';
      document.getElementById('fpa-height').value = '';
      document.getElementById('fpa-degree').value = '';
      document.getElementById('fpa-result').classList.add('hidden');
    }

    function calculateGradient() {
      const gsInput = document.getElementById('grad-gs').value.trim();
      const gradInput = document.getElementById('grad-percent').value.trim();
      const rocInput = document.getElementById('grad-roc').value.trim();

      const gs = gsInput !== '' ? parseFloat(gsInput) : null;
      let gradient = gradInput !== '' ? parseFloat(gradInput) : null;
      const roc = rocInput !== '' ? parseFloat(rocInput) : null;

      const resBox = document.getElementById('grad-result');

      // 1. GS and Gradient provided -> Calculate ROC and show FPA beside it!
      if (roc === null && gs !== null && gradient !== null) {
        const calcRoc = (gs * gradient * 101.27) / 100;
        const fpaVal = gradient * 0.57;

        resBox.classList.remove('hidden');
        renderDual('grad-result-content', 'ROC', fmt2(calcRoc) + ' FPM', 'FPA', fmt2(fpaVal) + '&deg;');
        document.getElementById('grad-roc').value = fmt2(calcRoc);
      }
      // 2. GS and ROC provided -> Calculate Gradient (%) and show FPA beside it!
      else if (gradient === null && gs !== null && roc !== null) {
        if (gs === 0) {
          resBox.classList.remove('hidden');
          renderSingle('grad-result-content', 'Error', 'Invalid GS');
          return;
        }
        const calcGrad = (roc * 100) / (gs * 101.27);
        const fpaVal = calcGrad * 0.57;

        resBox.classList.remove('hidden');
        renderDual('grad-result-content', 'Gradient', fmt2(calcGrad) + '%', 'FPA', fmt2(fpaVal) + '&deg;');
        document.getElementById('grad-percent').value = fmt2(calcGrad);
      }
      // 3. Gradient and ROC provided -> Calculate GS and show FPA beside it!
      else if (gs === null && gradient !== null && roc !== null) {
        if (gradient === 0) {
          resBox.classList.remove('hidden');
          renderSingle('grad-result-content', 'Error', 'Invalid Gradient');
          return;
        }
        const calcGs = (roc * 100) / (gradient * 101.27);
        const fpaVal = gradient * 0.57;

        resBox.classList.remove('hidden');
        renderDual('grad-result-content', 'GS', fmt2(calcGs) + ' kts', 'FPA', fmt2(fpaVal) + '&deg;');
        document.getElementById('grad-gs').value = fmt2(calcGs);
      }
      else if (gs !== null && gradient !== null && roc !== null) {
        resBox.classList.remove('hidden');
        renderSingle('grad-result-content', 'Notice', 'Clear 1 value');
      } else {
        resBox.classList.remove('hidden');
        renderSingle('grad-result-content', 'Notice', 'Fill 2 values');
      }
    }

    function clearGradient() {
      document.getElementById('grad-gs').value = '';
      document.getElementById('grad-percent').value = '';
      document.getElementById('grad-roc').value = '';
      document.getElementById('grad-result').classList.add('hidden');
    }
  </script>
</body>
</html>
