<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aviation Calculator</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --sky: #38bdf8;
      --sky-soft: #f0f9ff;
      --sky-border: #bae6fd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 8px 0;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.3px;
    }

    .tabs {
      display: flex;
      background: #e2e8f0;
      border-radius: 12px;
      padding: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .calc-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
      display: none;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.06);
    }

    .calc-card.active {
      display: flex;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      display: flex;
      justify-content: space-between;
    }

    .input-group label span.unit {
      color: #94a3b8;
      font-weight: 500;
    }

    /* Standard number input with native spinner arrows */
    input[type="number"] {
      width: 100%;
      background: var(--sky-soft);
      border: 1.5px solid var(--sky-border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 1.15rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 1 !important;
      height: 28px;
      cursor: pointer;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
      background: #ffffff;
    }

    input[type="number"]::placeholder {
      color: #94a3b8;
      font-weight: 400;
      font-size: 0.95rem;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 6px;
    }

    button.btn {
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button.btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    button.btn-primary:active {
      transform: scale(0.98);
      background: #0369a1;
    }

    button.btn-secondary {
      background: #f1f5f9;
      color: #475569;
    }

    button.btn-secondary:active {
      transform: scale(0.98);
      background: #e2e8f0;
    }

    .result-box {
      margin-top: 4px;
      padding: 16px;
      background: var(--sky-soft);
      border: 1.5px solid var(--sky);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .result-box.hidden {
      display: none;
    }

    .result-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary);
      font-weight: 700;
    }

    .result-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0369a1;
    }

    .result-sub {
      font-size: 0.95rem;
      font-weight: 600;
      color: #0284c7;
      margin-top: 2px;
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</head>
<body>

  <div class="container">
    <header>
      <h1>Flight Calculator</h1>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('fpa')">FPA</button>
      <button class="tab-btn" onclick="switchTab('gradient')">Gradient</button>
    </div>

    <!-- Tab 1: FPA -->
    <div id="tab-fpa" class="calc-card active">
      <div class="input-group">
        <label for="fpa-dist">Distance <span class="unit">(NM)</span></label>
        <input type="number" step="any" id="fpa-dist" placeholder="Leave empty if unknown">
      </div>

      <div class="input-group">
        <label for="fpa-height">Height <span class="unit">(ft)</span></label>
        <input type="number" step="any" id="fpa-height" placeholder="Leave empty if unknown">
      </div>

      <div class="input-group">
        <label for="fpa-degree">FPA <span class="unit">(&deg;)</span></label>
        <input type="number" step="any" id="fpa-degree" placeholder="Leave empty if unknown">
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="clearFPA()">Clear</button>
        <button class="btn btn-primary" onclick="calculateFPA()">Calculate</button>
      </div>

      <div id="fpa-result" class="result-box hidden">
        <div class="result-title" id="fpa-res-title">Result</div>
        <div class="result-value" id="fpa-res-val">--</div>
        <div class="result-sub" id="fpa-res-sub"></div>
      </div>
    </div>

    <!-- Tab 2: Gradient -->
    <div id="tab-gradient" class="calc-card">
      <div class="input-group">
        <label for="grad-gs">Ground Speed (GS) <span class="unit">(kts)</span></label>
        <input type="number" step="any" id="grad-gs" placeholder="Leave empty if unknown">
      </div>

      <div class="input-group">
        <label for="grad-percent">Gradient <span class="unit">(%)</span></label>
        <input type="number" step="any" id="grad-percent" placeholder="Leave empty if unknown">
      </div>

      <div class="input-group">
        <label for="grad-roc">Rate of Climb (ROC) <span class="unit">(FPM)</span></label>
        <input type="number" step="any" id="grad-roc" placeholder="Leave empty if unknown">
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="clearGradient()">Clear</button>
        <button class="btn btn-primary" onclick="calculateGradient()">Calculate</button>
      </div>

      <div id="grad-result" class="result-box hidden">
        <div class="result-title" id="grad-res-title">Result</div>
        <div class="result-value" id="grad-res-val">--</div>
        <div class="result-sub" id="grad-res-sub"></div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.calc-card').forEach(card => card.classList.remove('active'));

      if (tab === 'fpa') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-fpa').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-gradient').classList.add('active');
      }
    }

    const NM_TO_FT = 6076;
    const fmt2 = num => (Math.round((num + Number.EPSILON) * 100) / 100).toFixed(2);
    const toRad = deg => (deg * Math.PI) / 180;
    const toDeg = rad => (rad * 180) / Math.PI;

    function calculateFPA() {
      const distInput = document.getElementById('fpa-dist').value.trim();
      const heightInput = document.getElementById('fpa-height').value.trim();
      const degreeInput = document.getElementById('fpa-degree').value.trim();

      const dist = distInput !== '' ? parseFloat(distInput) : null;
      const height = heightInput !== '' ? parseFloat(heightInput) : null;
      const degree = degreeInput !== '' ? parseFloat(degreeInput) : null;

      const resBox = document.getElementById('fpa-result');
      const resTitle = document.getElementById('fpa-res-title');
      const resVal = document.getElementById('fpa-res-val');
      const resSub = document.getElementById('fpa-res-sub');

      resBox.classList.remove('hidden');
      resSub.textContent = '';

      // 1. Height and FPA given -> Calculate Distance (NM)
      // Distance_ft = Height / tan(FPA) -> Distance_NM = Distance_ft / 6076
      if (dist === null && height !== null && degree !== null) {
        if (degree === 0 || Math.tan(toRad(degree)) === 0) {
          resTitle.textContent = "Error";
          resVal.textContent = "Invalid FPA";
          return;
        }
        const distFt = height / Math.tan(toRad(degree));
        const calcDistNM = distFt / NM_TO_FT;
        const gradVal = degree * 1.75;

        resTitle.textContent = "Distance";
        resVal.textContent = fmt2(calcDistNM) + " NM";
        resSub.textContent = "Gradient: " + fmt2(gradVal) + "%";

        document.getElementById('fpa-dist').value = fmt2(calcDistNM);
        document.getElementById('grad-percent').value = fmt2(gradVal);
      }
      // 2. Distance (NM) and Height (ft) given -> Calculate FPA (deg)
      // Distance_ft = Distance_NM * 6076 -> FPA = atan(Height / Distance_ft)
      else if (degree === null && dist !== null && height !== null) {
        if (dist === 0) {
          resTitle.textContent = "Error";
          resVal.textContent = "Invalid Distance";
          return;
        }
        const distFt = dist * NM_TO_FT;
        const calcDeg = toDeg(Math.atan(height / distFt));
        const gradVal = calcDeg * 1.75;

        resTitle.textContent = "FPA";
        resVal.innerHTML = fmt2(calcDeg) + "&deg;";
        resSub.textContent = "Gradient: " + fmt2(gradVal) + "%";

        document.getElementById('fpa-degree').value = fmt2(calcDeg);
        document.getElementById('grad-percent').value = fmt2(gradVal);
      }
      // 3. Distance (NM) and FPA (deg) given -> Calculate Height (ft)
      // Distance_ft = Distance_NM * 6076 -> Height = Distance_ft * tan(FPA)
      else if (height === null && dist !== null && degree !== null) {
        const distFt = dist * NM_TO_FT;
        const calcHeight = distFt * Math.tan(toRad(degree));
        const gradVal = degree * 1.75;

        resTitle.textContent = "Height";
        resVal.textContent = fmt2(calcHeight) + " ft";
        resSub.textContent = "Gradient: " + fmt2(gradVal) + "%";

        document.getElementById('fpa-height').value = fmt2(calcHeight);
        document.getElementById('grad-percent').value = fmt2(gradVal);
      }
      else if (dist !== null && height !== null && degree !== null) {
        resTitle.textContent = "Notice";
        resVal.textContent = "Clear 1 value";
      } else {
        resTitle.textContent = "Notice";
        resVal.textContent = "Fill 2 values";
      }
    }

    function clearFPA() {
      document.getElementById('fpa-dist').value = '';
      document.getElementById('fpa-height').value = '';
      document.getElementById('fpa-degree').value = '';
      const resSub = document.getElementById('fpa-res-sub');
      if (resSub) resSub.textContent = '';
      document.getElementById('fpa-result').classList.add('hidden');
    }

    function calculateGradient() {
      const gsInput = document.getElementById('grad-gs').value.trim();
      const gradInput = document.getElementById('grad-percent').value.trim();
      const rocInput = document.getElementById('grad-roc').value.trim();

      const gs = gsInput !== '' ? parseFloat(gsInput) : null;
      let gradient = gradInput !== '' ? parseFloat(gradInput) : null;
      const roc = rocInput !== '' ? parseFloat(rocInput) : null;

      const resBox = document.getElementById('grad-result');
      const resTitle = document.getElementById('grad-res-title');
      const resVal = document.getElementById('grad-res-val');
      const resSub = document.getElementById('grad-res-sub');

      resBox.classList.remove('hidden');
      resSub.textContent = '';

      let calculatedGrad = null;

      // 1. GS and Gradient provided -> Calculate ROC
      // ROC = (GS * gradient * 101.27) / 100
      if (roc === null && gs !== null && gradient !== null) {
        const calcRoc = (gs * gradient * 101.27) / 100;
        calculatedGrad = gradient;

        resTitle.textContent = "Rate of Climb (ROC)";
        resVal.textContent = fmt2(calcRoc) + " FPM";
        document.getElementById('grad-roc').value = fmt2(calcRoc);
      }
      // 2. GS and ROC provided -> Calculate Gradient (%)
      // Gradient = (ROC * 100) / (GS * 101.27)
      else if (gradient === null && gs !== null && roc !== null) {
        if (gs === 0) {
          resTitle.textContent = "Error";
          resVal.textContent = "Invalid GS";
          return;
        }
        calculatedGrad = (roc * 100) / (gs * 101.27);
        resTitle.textContent = "Gradient";
        resVal.textContent = fmt2(calculatedGrad) + "%";
        document.getElementById('grad-percent').value = fmt2(calculatedGrad);
      }
      // 3. Gradient and ROC provided -> Calculate GS
      // GS = (ROC * 100) / (Gradient * 101.27)
      else if (gs === null && gradient !== null && roc !== null) {
        if (gradient === 0) {
          resTitle.textContent = "Error";
          resVal.textContent = "Invalid Gradient";
          return;
        }
        calculatedGrad = gradient;
        const calcGs = (roc * 100) / (gradient * 101.27);
        resTitle.textContent = "Ground Speed (GS)";
        resVal.textContent = fmt2(calcGs) + " kts";
        document.getElementById('grad-gs').value = fmt2(calcGs);
      }
      else if (gs !== null && gradient !== null && roc !== null) {
        resTitle.textContent = "Notice";
        resVal.textContent = "Clear 1 value";
        return;
      } else {
        resTitle.textContent = "Notice";
        resVal.textContent = "Fill 2 values";
        return;
      }

      // If gradient was calculated/known, also generate FPA = Gradient * 0.57
      if (calculatedGrad !== null) {
        const autoFpa = calculatedGrad * 0.57;
        resSub.innerHTML = "FPA: " + fmt2(autoFpa) + "&deg;";
        document.getElementById('fpa-degree').value = fmt2(autoFpa);
      }
    }

    function clearGradient() {
      document.getElementById('grad-gs').value = '';
      document.getElementById('grad-percent').value = '';
      document.getElementById('grad-roc').value = '';
      const resSub = document.getElementById('grad-res-sub');
      if (resSub) resSub.textContent = '';
      document.getElementById('grad-result').classList.add('hidden');
    }
  </script>
</body>
</html>
